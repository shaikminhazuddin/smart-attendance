<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Smart Attendance System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --primary: #3b82f6;
      --primary-glow: rgba(59, 130, 246, 0.4);
      --student-accent: #10b981;
      --student-glow: rgba(16, 185, 129, 0.4);
      --bg-dark: #090d16;
      --card-bg: rgba(18, 26, 44, 0.78);
      --card-border: rgba(255, 255, 255, 0.1);
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 15% 20%, #172554 0%, transparent 40%),
                  radial-gradient(circle at 85% 80%, #1e1b4b 0%, transparent 40%),
                  var(--bg-dark);
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient cybernetic background grid */
    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
    }

    .login-container {
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 2;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 35px rgba(59, 130, 246, 0.15);
      animation: fadeIn 0.5s ease-out;
      transition: box-shadow 0.3s ease;
    }

    .login-card.student-mode {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 35px rgba(16, 185, 129, 0.2);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .brand-icon-wrap {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      box-shadow: 0 10px 25px var(--primary-glow);
      font-size: 2rem;
      color: #fff;
      transition: all 0.3s ease;
    }

    .brand-icon-wrap.student {
      background: linear-gradient(135deg, #059669, #10b981);
      box-shadow: 0 10px 25px var(--student-glow);
    }

    .brand-title {
      font-weight: 800;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
      text-align: center;
      margin-bottom: 4px;
      background: linear-gradient(180deg, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      color: var(--text-muted);
      font-size: 0.88rem;
      text-align: center;
      margin-bottom: 22px;
    }

    /* Role Toggle Switch */
    .role-toggle-wrap {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 4px;
      display: flex;
      gap: 6px;
      margin-bottom: 24px;
    }

    .role-btn {
      flex: 1;
      padding: 10px 14px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-weight: 700;
      font-size: 0.92rem;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .role-btn:hover {
      color: #f1f5f9;
    }

    .role-btn.active.admin-active {
      background: linear-gradient(135deg, #2563eb, #3b82f6);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.45);
    }

    .role-btn.active.student-active {
      background: linear-gradient(135deg, #059669, #10b981);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.45);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #64748b;
      font-size: 1.1rem;
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-control-custom {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 14px 12px 42px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-control-custom:focus {
      background: rgba(15, 23, 42, 0.9);
      border-color: #3b82f6;
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
    }

    .student-mode .form-control-custom:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2);
    }

    .form-control-custom:focus + .input-icon,
    .form-control-custom:focus ~ .input-icon {
      color: #3b82f6;
    }

    .student-mode .form-control-custom:focus + .input-icon,
    .student-mode .form-control-custom:focus ~ .input-icon {
      color: #10b981;
    }

    .toggle-pass-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 4px 6px;
      font-size: 1.1rem;
      transition: color 0.2s;
    }

    .toggle-pass-btn:hover {
      color: #cbd5e1;
    }

    .btn-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
      font-size: 0.98rem;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
      transition: all 0.25s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }

    .btn-submit:hover {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      transform: translateY(-1px);
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.45);
    }

    .btn-submit.student {
      background: linear-gradient(135deg, #059669, #10b981);
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
    }

    .btn-submit.student:hover {
      background: linear-gradient(135deg, #10b981, #059669);
      box-shadow: 0 12px 25px rgba(16, 185, 129, 0.45);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .demo-credentials {
      margin-top: 22px;
      background: rgba(30, 41, 59, 0.5);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.82rem;
      color: #94a3b8;
    }

    .demo-credentials code {
      background: rgba(15, 23, 42, 0.85);
      color: #60a5fa;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 600;
    }

    .student-demo code {
      color: #34d399 !important;
    }

    .alert-custom {
      background: rgba(220, 38, 38, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.88rem;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-card" id="loginCard">
      
      <!-- Brand Icon -->
      <div class="brand-icon-wrap" id="portalIconWrap">
        <i class="bi bi-shield-lock-fill" id="portalIcon"></i>
      </div>
      
      <!-- Titles -->
      <h1 class="brand-title" id="portalTitle">Admin Portal</h1>
      <p class="brand-subtitle" id="portalSubtitle">Smart AI Attendance Management System</p>

      <!-- Role Toggle Tabs -->
      <div class="role-toggle-wrap">
        <button type="button" class="role-btn active admin-active" id="tabAdmin" data-role="admin">
          <i class="bi bi-shield-lock-fill"></i>
          <span>Admin Portal</span>
        </button>
        <button type="button" class="role-btn" id="tabStudent" data-role="student">
          <i class="bi bi-mortarboard-fill"></i>
          <span>Student Portal</span>
        </button>
      </div>

      <!-- Flash / Error Alert -->
      {% if error %}
      <div class="alert-custom">
        <i class="bi bi-exclamation-triangle-fill fs-5"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <!-- Form -->
      <form method="POST" action="/login{% if request.query_string %}?{{ request.query_string.decode('utf-8') }}{% endif %}" id="loginForm">
        <input type="hidden" name="role" id="roleInput" value="{{ role or 'admin' }}">

        <div class="form-group">
          <label class="form-label" for="username" id="usernameLabel">Admin Username</label>
          <div class="input-wrapper">
            <input type="text" id="username" name="username" class="form-control-custom" placeholder="Enter admin username" value="{{ username or '' }}" required autofocus>
            <i class="bi bi-person-fill input-icon" id="userIcon"></i>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" class="form-control-custom" placeholder="••••••••" required>
            <i class="bi bi-key-fill input-icon"></i>
            <button type="button" class="toggle-pass-btn" id="togglePass" title="Toggle password visibility">
              <i class="bi bi-eye-slash" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          <i class="bi bi-box-arrow-in-right"></i>
          <span id="btnSubmitText">Sign In to Admin Dashboard</span>
        </button>
      </form>

      <!-- Demo Credentials for Admin -->
      <div class="demo-credentials text-center" id="adminDemo">
        <div class="fw-semibold text-light mb-1"><i class="bi bi-key"></i> Default Admin Credentials:</div>
        User: <code>admin</code> &bull; Password: <code>admin123</code>
      </div>

      <!-- Demo Credentials for Student -->
      <div class="demo-credentials student-demo text-center" id="studentDemo" style="display:none;">
        <div class="fw-semibold text-light mb-1"><i class="bi bi-mortarboard"></i> Student Access:</div>
        Student ID: <code>student</code> &bull; Password: <code>student123</code>
        <div class="small mt-1 text-muted">Or use any registered Student ID with password <code>student123</code></div>
      </div>

    </div>
  </div>

  <script>
    const tabAdmin = document.getElementById("tabAdmin");
    const tabStudent = document.getElementById("tabStudent");
    const roleInput = document.getElementById("roleInput");
    const loginCard = document.getElementById("loginCard");
    const portalIconWrap = document.getElementById("portalIconWrap");
    const portalIcon = document.getElementById("portalIcon");
    const portalTitle = document.getElementById("portalTitle");
    const portalSubtitle = document.getElementById("portalSubtitle");
    const usernameLabel = document.getElementById("usernameLabel");
    const usernameInput = document.getElementById("username");
    const userIcon = document.getElementById("userIcon");
    const btnSubmit = document.getElementById("btnSubmit");
    const btnSubmitText = document.getElementById("btnSubmitText");
    const adminDemo = document.getElementById("adminDemo");
    const studentDemo = document.getElementById("studentDemo");

    function setRole(role) {
      roleInput.value = role;
      if (role === "student") {
        tabAdmin.className = "role-btn";
        tabStudent.className = "role-btn active student-active";
        loginCard.classList.add("student-mode");
        portalIconWrap.classList.add("student");
        portalIcon.className = "bi bi-mortarboard-fill";
        portalTitle.textContent = "Student Portal";
        portalSubtitle.textContent = "Check your attendance records & status";
        usernameLabel.textContent = "Student ID";
        usernameInput.placeholder = "Enter your Student ID (e.g. 24A91A01 or student)";
        userIcon.className = "bi bi-person-badge-fill input-icon";
        btnSubmit.classList.add("student");
        btnSubmitText.textContent = "Sign In as Student";
        adminDemo.style.display = "none";
        studentDemo.style.display = "block";
        document.title = "Student Login — Smart Attendance System";
      } else {
        tabStudent.className = "role-btn";
        tabAdmin.className = "role-btn active admin-active";
        loginCard.classList.remove("student-mode");
        portalIconWrap.classList.remove("student");
        portalIcon.className = "bi bi-shield-lock-fill";
        portalTitle.textContent = "Admin Portal";
        portalSubtitle.textContent = "Smart AI Attendance Management System";
        usernameLabel.textContent = "Admin Username";
        usernameInput.placeholder = "Enter admin username";
        userIcon.className = "bi bi-person-fill input-icon";
        btnSubmit.classList.remove("student");
        btnSubmitText.textContent = "Sign In to Admin Dashboard";
        studentDemo.style.display = "none";
        adminDemo.style.display = "block";
        document.title = "Admin Login — Smart Attendance System";
      }
    }

    tabAdmin.addEventListener("click", () => setRole("admin"));
    tabStudent.addEventListener("click", () => setRole("student"));

    // Toggle password visibility
    const togglePass = document.getElementById("togglePass");
    const passInput = document.getElementById("password");
    const eyeIcon = document.getElementById("eyeIcon");

    togglePass.addEventListener("click", () => {
      const isPass = passInput.type === "password";
      passInput.type = isPass ? "text" : "password";
      eyeIcon.className = isPass ? "bi bi-eye" : "bi bi-eye-slash";
    });

    // Form submission spinner
    document.getElementById("loginForm").addEventListener("submit", () => {
      btnSubmit.innerHTML = `<span class="spinner-border spinner-border-sm" role="status"></span> Signing In...`;
      btnSubmit.disabled = true;
    });

    // Initialize initial state based on server template variable
    const initialRole = "{{ role or 'admin' }}";
    setRole(initialRole);
  </script>
</body>
</html>
